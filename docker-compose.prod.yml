# Production docker-compose
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
name: ai-interview-bot-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ${REGISTRY:-ghcr.io/yourorg}/ai-interview-bot-backend:${TAG:-latest}
    container_name: aibot-backend
    restart: always
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    expose:
      - "8000"
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
      - backend_downloads:/app/downloads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging: *default-logging
    networks:
      - aibot-net
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./ai-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.example.com}
    image: ${REGISTRY:-ghcr.io/yourorg}/ai-interview-bot-frontend:${TAG:-latest}
    container_name: aibot-frontend
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.example.com}
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    logging: *default-logging
    networks:
      - aibot-net
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.27-alpine
    container_name: aibot-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
    networks:
      - aibot-net
    security_opt:
      - no-new-privileges:true

volumes:
  backend_data:
  backend_uploads:
  backend_downloads:
  nginx_cache:

networks:
  aibot-net:
    driver: bridge
