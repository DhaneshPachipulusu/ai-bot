global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: ai-interview-bot
    environment: production

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:8000']
        labels:
          service: backend
          tier: api

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: host

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: containers

  - job_name: nginx
    metrics_path: /metrics
    static_configs:
      - targets: ['nginx:80']
        labels:
          service: nginx
